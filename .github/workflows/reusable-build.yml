name: reusable-build

on:
  workflow_call:
    inputs:
      push_image:
        required: true
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.push_image == true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository_owner }}/todo-app:latest .

      - name: Push Docker image
        if: inputs.push_image == true
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/todo-app:latest
